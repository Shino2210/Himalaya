<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Classement Himalaya</title>
<meta name="description" content="Le classement des joueurs Himalaya : niveau de compte, temps de jeu et Himacoins." />
<meta name="theme-color" content="#070A0F" />
<link rel="icon" href="img/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="web.css" />
<style>
  .tabs { display: inline-flex; gap: 6px; padding: 5px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 26px; flex-wrap: wrap; }
  .tabs button { height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 700 14px Inter, sans-serif; cursor: pointer; }
  .tabs button.on { background: rgba(32,217,255,.14); color: var(--cyan); }
  .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 14px; align-items: end; margin-bottom: 22px; }
  .pod { text-align: center; border-radius: 20px; padding: 20px 12px 18px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .15s; }
  .pod:hover { transform: translateY(-3px); }
  .pod .medal { font-size: 30px; line-height: 1; }
  .pod.p1 { padding-top: 30px; border-color: rgba(255,194,77,.5); background: radial-gradient(ellipse at top, rgba(255,194,77,.2), transparent 70%), var(--panel); }
  .pod.p2 { border-color: rgba(200,215,230,.35); }
  .pod.p3 { border-color: rgba(205,127,50,.4); }
  .pod .nm { font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod .val { font: 900 18px Orbitron, sans-serif; color: var(--cyan); }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, background .15s; }
  .row:hover { border-color: rgba(32,217,255,.4); background: #101a25; }
  .row.me { border-color: var(--cyan); background: rgba(32,217,255,.08); }
  .row .pos { width: 34px; text-align: center; font: 900 15px Orbitron, sans-serif; color: var(--muted); }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { font-weight: 800; white-space: nowrap; }
  .find { display: flex; gap: 8px; max-width: 420px; margin-left: auto; }
  .top { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  @media (max-width: 640px) { .podium { grid-template-columns: 1fr; } .pod.p1 { order: -1; } .find { margin-left: 0; max-width: none; width: 100%; } }
</style>
</head>
<body>
<main class="page">
  <div class="wrap">
    <div class="top">
      <div><h1 class="h1">🏆 Classement</h1><p class="sub" style="margin:0" id="count">Les meilleurs joueurs d'Himalaya.</p></div>
      <form class="find" id="find"><div class="field" style="flex:1;margin:0"><input name="u" placeholder="Chercher un joueur…" /></div><button class="btn btn-ghost">Voir</button></form>
    </div>
    <div class="tabs" id="tabs">
      <button data-k="level" class="on">⭐ Niveau</button>
      <button data-k="time">⏱️ Temps de jeu</button>
      <button data-k="coins">🪙 Himacoins</button>
    </div>
    <div id="board"><div class="spinner"></div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="data.js"></script>
<script src="web.js"></script>
<script>
  renderNav('rank')
  let data = null, kind = new URLSearchParams(location.search).get('k') ?? 'level', myName = null
  const fmt = { level: (r) => `Niv. ${r.value}`, time: (r) => hours(r.value), coins: (r) => `🪙 ${nf(r.value)}` }
  const empty = { level: 'Personne pour l\'instant.', time: 'Personne n\'a encore joué.', coins: 'Personne n\'a encore d\'Himacoins.' }

  function render() {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.k === kind))
    const list = data?.[kind] ?? []
    if (!list.length) return ($('board').innerHTML = `<div class="panel empty">${empty[kind]}</div>`)
    const link = (r) => `joueur.html?u=${encodeURIComponent(r.username)}`
    const pod = (r, i) => r ? `<a class="pod p${i + 1}" href="${link(r)}"><span class="medal">${['🥇', '🥈', '🥉'][i]}</span>${avatarHTML(r.avatar_url, r.username, i === 0 ? 92 : 72, r.vip)}<span class="nm">${nameHTML(r, false)}</span><span class="val">${fmt[kind](r)}</span></a>` : '<div></div>'
    const rows = list.slice(3).map((r, i) => `<a class="row${r.username === myName ? ' me' : ''}" href="${link(r)}"><span class="pos">${i + 4}</span>${avatarHTML(r.avatar_url, r.username, 40, r.vip)}<span class="nm">${nameHTML(r)}</span><span class="val">${fmt[kind](r)}</span></a>`).join('')
    $('board').innerHTML = `<div class="podium">${pod(list[1], 1)}${pod(list[0], 0)}${pod(list[2], 2)}</div><div class="rows">${rows}</div>`
  }

  document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => { kind = b.dataset.k; history.replaceState(null, '', '?k=' + kind); render() }))
  $('find').onsubmit = (e) => { e.preventDefault(); const v = new FormData(e.target).get('u').trim(); if (v) location.href = 'joueur.html?u=' + encodeURIComponent(v) }

  sb.rpc('web_leaderboards').then(({ data: d, error }) => {
    if (error) return ($('board').innerHTML = '<div class="panel empty">Classement indisponible pour le moment.</div>')
    data = d
    $('count').textContent = `${nf(d.players)} joueurs classés · mis à jour en direct`
    render()
  })
  me().then((p) => { if (p) { myName = p.username; if (data) render() } })
</script>
</body>
</html>
