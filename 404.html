<script>
  // Short profile links: …/Himalaya/joueur/Pseudo → …/Himalaya/joueur.html?u=Pseudo
  const p = location.pathname
  const i = p.indexOf('/joueur/')
  if (i >= 0) location.replace(p.slice(0, i) + '/joueur.html?u=' + p.slice(i + 8).replace(/\/+$/, ''))
  else location.replace('/Himalaya/')
</script>
