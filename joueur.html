<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profil Himalaya</title>
<meta name="description" content="Profil public d'un joueur Himalaya : niveau, rang, temps de jeu et jeux préférés." />
<meta name="theme-color" content="#070A0F" />
<link rel="icon" href="img/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="web.css" />
<style>
  .banner { position: relative; height: 230px; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
  .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(7,10,15,.85)); }
  .head { position: relative; display: flex; align-items: flex-end; gap: 20px; margin: -70px 26px 0; z-index: 1; flex-wrap: wrap; }
  .head .av { border: 4px solid var(--bg); }
  .who { flex: 1; min-width: 220px; padding-bottom: 6px; }
  .who .name { font-size: clamp(24px, 4vw, 34px); line-height: 1.15; }
  .who .title { color: #FFE08A; font-weight: 700; font-size: 14px; }
  .share { display: flex; gap: 8px; padding-bottom: 8px; }
  .grid2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-top: 26px; }
  .lvl { display: flex; align-items: center; gap: 18px; }
  .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin: 10px 0 6px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--cyan), var(--violet)); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font: 900 20px Orbitron, sans-serif; }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .game { border-radius: 14px; overflow: hidden; background: var(--panel2); border: 1px solid var(--line); }
  .game .cov { aspect-ratio: 460 / 215; background: linear-gradient(135deg, #16324d, #0a1119); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .game .cov img { width: 100%; height: 100%; object-fit: cover; }
  .game .gi { padding: 10px 12px; }
  .game .gn { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lock { max-width: 520px; margin: 30px auto 0; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } .games { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } .games { grid-template-columns: 1fr; } .head { margin: -60px 12px 0; } .banner { height: 170px; } }
</style>
</head>
<body>
<main class="page"><div class="wrap" id="root"><div class="spinner"></div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="data.js"></script>
<script src="web.js"></script>
<script>
  renderNav('profile')
  const root = $('root')
  const name = new URLSearchParams(location.search).get('u') ?? ''

  async function search(q) {
    root.innerHTML = `<div class="panel lock center">
      <h1 class="h2">🔎 Trouver un joueur</h1>
      <p class="sub" style="margin-bottom:18px">${q ? `Aucun joueur « ${esc(q)} ».` : 'Entre le pseudo d\'un joueur Himalaya.'}</p>
      <form id="f" style="display:flex;gap:8px"><div class="field" style="flex:1;margin:0"><input name="u" placeholder="Pseudo" value="${esc(q)}" /></div><button class="btn btn-main">Voir</button></form>
    </div>`
    $('f').onsubmit = (e) => { e.preventDefault(); const v = new FormData(e.target).get('u').trim(); if (v) location.search = '?u=' + encodeURIComponent(v) }
  }

  async function load() {
    if (!name) return search('')
    const { data: p, error } = await sb.rpc('web_profile', { p_name: name })
    if (error || !p) return search(name)
    document.title = `${p.username} · Profil Himalaya`
    const url = profileUrl(p.username)
    const head = `
      <div class="banner" style="background:${bannerCSS(p.banner_id)}"></div>
      <div class="head">
        ${avatarHTML(p.avatar_url, p.username, 132, p.vip)}
        <div class="who">
          <div class="name">${nameHTML(p)}</div>
          ${p.title ? `<div class="title">${esc(p.title)}</div>` : ''}
          ${p.private ? '' : `<div class="small">Membre depuis le ${dateFr(p.created_at)}</div>`}
        </div>
        <div class="share">
          <button class="btn btn-ghost btn-sm" id="copy">🔗 Copier le lien</button>
          ${navigator.share ? '<button class="btn btn-ghost btn-sm" id="share">Partager</button>' : ''}
        </div>
      </div>`
    if (p.private) {
      root.innerHTML = head + `<div class="panel lock center"><div style="font-size:34px">🔒</div><h2 class="h2">Profil privé</h2><p class="small">Ce joueur a choisi de garder son profil privé.</p></div>`
    } else {
      const L = p.level ?? { level: 1, xp: 0, level_xp: 0, next_xp: 1 }
      const pct = Math.max(2, Math.min(100, ((L.xp - L.level_xp) / Math.max(1, L.next_xp - L.level_xp)) * 100))
      const s = p.stats
      const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`
      const games = p.top_games.map((g) => {
        const steam = /^\d+$/.test(g.s ?? '') ? `https://cdn.akamai.steamstatic.com/steam/apps/${g.s}/header.jpg` : null
        const ach = Array.isArray(g.a) && g.a[1] ? `🏆 ${g.a[0]}/${g.a[1]}` : ''
        return `<div class="game"><div class="cov">🎮${steam ? `<img src="${steam}" alt="" loading="lazy" onerror="this.remove()" style="position:absolute;inset:0" />` : ''}</div>
          <div class="gi"><div class="gn" title="${esc(g.n)}">${esc(g.n)}</div><div class="small">${hours(g.m)}${ach ? ' · ' + ach : ''}</div></div></div>`
      }).join('')
      root.innerHTML = head + `
        <div class="grid2">
          <div class="panel">
            <div class="lvl">
              ${levelHTML(L.level, 84)}
              <div style="flex:1">
                <div class="small">Niveau de compte</div>
                <div style="font:900 24px Orbitron,sans-serif">Niveau ${L.level}</div>
                <div style="color:var(--cyan);font-weight:700;font-size:14px">${esc(levelTitle(L.level))}</div>
                <div class="bar"><i style="width:${pct}%"></i></div>
                <div class="small">${nf(L.xp - L.level_xp)} / ${nf(L.next_xp - L.level_xp)} XP vers le niveau ${L.level + 1}</div>
              </div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;align-items:center">
              <div><div class="small">Rang de saison</div>${rankHTML(p.rank_id, 34)}</div>
              <div><div class="small">Temps de jeu</div><b style="font-size:18px">${hours(p.minutes)}</b></div>
              ${p.coins != null ? `<div><div class="small">Himacoins</div><b style="font-size:18px;color:var(--gold)">🪙 ${nf(p.coins)}</b></div>` : ''}
            </div>
          </div>
          <div class="panel">
            <h2 class="h2" style="font-size:18px">Statistiques</h2>
            <div class="stats">
              ${stat(nf(s.games), 'jeux')}${stat(nf(s.trophies), 'trophées')}${stat(nf(s.completions), 'jeux terminés à 100 %')}${stat(nf(s.friends), 'amis')}
              ${stat(s.pass, 'niveau du passe')}${stat(s.secrets + '/15', 'succès secrets')}${stat(nf(s.duos), 'duos du mois')}${stat(p.vip ? '👑' : '—', 'VIP')}
            </div>
          </div>
        </div>
        <h2 class="h2" style="margin-top:32px">🎮 Jeux les plus joués</h2>
        ${games ? `<div class="games">${games}</div>` : '<div class="panel empty">Pas encore de temps de jeu.</div>'}
        <div class="panel center" style="margin-top:34px">
          <b>Toi aussi, rejoins ${esc(p.username)} sur Himalaya</b>
          <p class="small" style="margin:4px 0 14px">Tous tes jeux dans un seul launcher, avec 14 jours d'essai gratuit.</p>
          <a class="btn btn-main" href="index.html#compte">Essayer gratuitement</a>
        </div>`
      root.querySelectorAll('.game .cov').forEach((c) => (c.style.position = 'relative'))
    }
    $('copy').onclick = async () => { await navigator.clipboard.writeText(url); $('copy').textContent = '✓ Lien copié' ; setTimeout(() => ($('copy').textContent = '🔗 Copier le lien'), 1600) }
    $('share')?.addEventListener('click', () => navigator.share({ title: `${p.username} sur Himalaya`, url }).catch(() => {}))
  }
  load()
</script>
</body>
</html>
